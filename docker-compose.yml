  #         "--spider",
  #         "http://localhost:8090/health",
  #       ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

  # MySQL 配置示例 (取消注释以使用 MySQL)
  # 注意: 此服务与上面的 'llm-proxy' 服务冲突。请只启用其中一个。
  # mysql:
  #   image: mysql:8.0
