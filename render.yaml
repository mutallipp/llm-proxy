services:
  - type: web
    name: llm-proxy
    runtime: docker
    plan: free
    envVars:
      - key: LLM_PROXY_SERVER_PORT
        value: 8090
      - key: LLM_PROXY_DB_DIALECT
        value: postgres
      - key: LLM_PROXY_DB_DSN
        fromDatabase:
          name: llm-proxy-db
          property: connectionString
      - key: LLM_PROXY_LOG_LEVEL
        value: info
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: llm-proxy-db
    plan: free