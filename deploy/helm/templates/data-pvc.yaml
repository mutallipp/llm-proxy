{{- if .Values.llm-proxy.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llm-proxy.fullname" . }}-data
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-proxy
spec:
  accessModes:
    {{- toYaml .Values.llm-proxy.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.llm-proxy.persistence.size }}
  {{- if .Values.llm-proxy.persistence.storageClass }}
  storageClassName: {{ .Values.llm-proxy.persistence.storageClass }}
  {{- end }}
{{- end }}