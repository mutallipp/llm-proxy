# AxonHub Adapter MVP 反向代理示例
#
# 用途：把 AxonHub 单实例 Adapter 网关对外只暴露三类路径：
#   1. /admin/*            后台管理（继续复用现有登录）
#   2. /{adapter}/v1/*     消费入口（pi-anthropic、pi-openai、codex-openai 等）
#   3. /health             健康检查
#
# 其它路径（如 /v1、/anthropic/v1、/gemini/*、/oauth/*）一律 444，
# 避免旧平台入口被消费端意外打到。
#
# 把这段贴到反代 nginx 的 server { ... } 内；stream/HTTP/SSL 配置按你部署习惯补。

upstream axonhub_backend {
    server 127.0.0.1:8090;  # Docker 端口映射或同机部署
    keepalive 32;
}

# 健康检查（无需鉴权）
location = /health {
    access_log off;
    proxy_pass http://axonhub_backend/health;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
}

# 后台管理入口（继续走 JWT）
location /admin/ {
    proxy_pass http://axonhub_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # 管理面板长连接、超时放宽
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_buffering off;  # 流式响应需要
}

# Adapter 消费入口（动态 /:adapter/v1/...）
location ~ ^/[^/]+/v1/ {
    proxy_pass http://axonhub_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # AI 流式响应通常需要更长读超时
    proxy_read_timeout 600s;
    proxy_send_timeout 60s;

    # 关闭缓冲，否则 SSE 事件会延迟到达客户端
    proxy_buffering off;
    proxy_cache off;
}

# 兜底：拒绝其它一切路径
location / {
    # 444 直接关闭连接，比 403/404 都不返回任何内容，
    # 避免泄露 AxonHub 路由信息。
    return 444;
}