# schema tells gqlgen where the GraphQL schema is located.
schema:
  # llm-proxy.graphql must be loaded before ent.graphql because it defines DisabledAPIKey
  # which is referenced by the disabled_api_keys field in Channel schema
  - llm-proxy.graphql
  - ent.graphql
  - dashboard.graphql
  - scopes.graphql
  - me.graphql
  - system.graphql
  - filter.graphql
  - model.graphql
  - backup.graphql
  - channel_probe.graphql
  - prompt.graphql
  - prompt_protection_rule.graphql
  - price.graphql
  - cost.graphql
  - analytics.graphql

omit_gqlgen_version_in_file_notice: true

#exec:
#  layout: follow-schema
#  dir: ./graph
#  package: graph

# resolver reports where the resolver implementations go.
resolver:
  layout: follow-schema
  dir: .

# gqlgen will search for any type names in the schema in these go packages
# if they match it will use them, otherwise it will generate them.

# autobind tells gqngen to search for any type names in the GraphQL schema in the
# provided package. If they match it will use them, otherwise it will generate new.
autobind:
  - github.com/99designs/gqlgen/graphql/introspection
  - github.com/mutallipp/llm-proxy/internal/ent
  - github.com/mutallipp/llm-proxy/internal/ent/user
  - github.com/mutallipp/llm-proxy/internal/ent/apikey
  - github.com/mutallipp/llm-proxy/internal/ent/request
  - github.com/mutallipp/llm-proxy/internal/ent/requestexecution
  - github.com/mutallipp/llm-proxy/internal/ent/channel
  - github.com/mutallipp/llm-proxy/internal/server/biz

converters:
  - from: "*github.com/mutallipp/llm-proxy/internal/objects.GUID"
    to: "int"
    with: "github.com/mutallipp/llm-proxy/internal/objects.ConvertGUIDPtrToInt"

  - from: "github.com/mutallipp/llm-proxy/internal/objects.GUID"
    to: "int"
    with: "github.com/mutallipp/llm-proxy/internal/objects.ConvertGUIDPtrToInt"

  - from: "github.com/mutallipp/llm-proxy/internal/objects.GUID"
    to: "*int"
    with: "github.com/mutallipp/llm-proxy/internal/objects.ConvertGUIDPtrToIntPtr"

  - from: "*github.com/mutallipp/llm-proxy/internal/objects.GUID"
    to: "*int"
    with: "github.com/mutallipp/llm-proxy/internal/objects.ConvertGUIDPtrToIntPtr"

  - from: "[]*github.com/mutallipp/llm-proxy/internal/objects.GUID"
    to: "[]*int"
    with: "github.com/mutallipp/llm-proxy/internal/objects.ConvertGUIDPtrsToIntPtrs"

  - from: "[]*github.com/mutallipp/llm-proxy/internal/objects.GUID"
    to: "[]int"
    with: "github.com/mutallipp/llm-proxy/internal/objects.ConvertGUIDPtrsToInts"

